<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSathi - Alerts & Conversational Q&A</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&family=Noto+Sans+Telugu:wght@500;600;700&display=swap" rel="stylesheet">
  <style id="auth-guard">html { visibility: hidden; }</style>
  <script src="/vendor/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/speech.js"></script>
  <script src="/js/tts.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    window.VI.auth.requireSession();
  </script>
  <style>
    :root {
      --font-family-base: 'Baloo 2', 'Noto Sans Devanagari', 'Noto Sans Telugu', system-ui, -apple-system, sans-serif;
      --color-primary-blue: #1D4ED8;
      --color-primary-blue-hover: #1E40AF;
      --color-warm-accent: #EA580C;
      --color-stock-green: #15803D;
      --color-stock-green-bg: #DCFCE7;
      --color-stock-red: #B91C1C;
      --color-stock-red-bg: #FEE2E2;
      --color-stock-amber: #B45309;
      --color-stock-amber-bg: #FEF3C7;
      --color-bg-app: #F8FAFC;
      --color-bg-surface: #FFFFFF;
      --color-text-primary: #0F172A;
      --color-text-secondary: #64748B;
      --color-border-subtle: #E2E8F0;
      --border-width: 1.5px;
      --chat-user-bg: #EFF6FF;
      --chat-user-text: #1E40AF;
      --chat-system-bg: #FFFFFF;
    }

    body.font-devanagari, .font-devanagari {
      font-family: 'Noto Sans Devanagari', var(--font-family-base) !important;
    }

    body.font-telugu, .font-telugu {
      font-family: 'Noto Sans Telugu', var(--font-family-base) !important;
    }

    [data-theme="outdoor"] {
      --color-primary-blue: #0C2366;
      --color-primary-blue-hover: #081744;
      --color-warm-accent: #C2410C;
      --color-stock-green: #054F26;
      --color-stock-green-bg: #FFFFFF;
      --color-stock-red: #7F1D1D;
      --color-stock-red-bg: #FFFFFF;
      --color-stock-amber: #78350F;
      --color-stock-amber-bg: #FFFFFF;
      --color-bg-app: #FFFFFF;
      --color-bg-surface: #FFFFFF;
      --color-text-primary: #000000;
      --color-text-secondary: #1E293B;
      --color-border-subtle: #000000;
      --border-width: 2.5px;
      --chat-user-bg: #F1F5F9;
      --chat-user-text: #000000;
      --chat-system-bg: #FFFFFF;
    }

    body {
      font-family: var(--font-family-base);
      background-color: var(--color-bg-app);
      color: var(--color-text-primary);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .bubble-user {
      border-radius: 18px 18px 4px 18px;
    }

    .bubble-system {
      border-radius: 18px 18px 18px 4px;
    }

    .mic-shadow {
      box-shadow: 0 8px 24px rgba(29, 78, 216, 0.35);
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col items-center justify-start">
  
  <!-- Interactive Controller Header -->
  <div class="w-full max-w-sm mb-3 space-y-2">
    <div class="flex items-center justify-between text-xs font-bold px-1">
      <span class="text-blue-800 bg-blue-100 px-2.5 py-1 rounded-full">Alerts &amp; Voice Q&amp;A</span>
      <button onclick="toggleSunlightMode()" id="sunlightBtn" class="px-2.5 py-1 rounded-lg border bg-white shadow-sm flex items-center gap-1 cursor-pointer active:scale-95">
        <span>☀️</span>
        <span id="sunlightLabel">Sunlight Mode</span>
      </button>
    </div>

    <!-- State Switcher: Active Alerts vs Healthy Empty State -->
    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-200/80 rounded-xl text-xs font-bold text-center">
      <button onclick="setAlertState('active')" id="btn-active" class="py-1.5 rounded-lg bg-white shadow text-rose-800 cursor-pointer">
        ⚠️ <span data-i18n="alertsPage.activeAlerts">Active Alerts</span> (<span id="activeCountBadge">0</span>)
      </button>
      <button onclick="setAlertState('healthy')" id="btn-healthy" class="py-1.5 rounded-lg text-slate-700 cursor-pointer">
        ✓ <span data-i18n="alertsPage.allHealthy">All Healthy</span> (<span id="healthyCountBadge">0</span>)
      </button>
    </div>
  </div>

  <!-- Mobile Device Simulation Frame -->
  <main class="w-full max-w-sm bg-[var(--color-bg-surface)] rounded-3xl border shadow-2xl relative flex flex-col justify-between overflow-hidden" style="border-width: var(--border-width); border-color: var(--color-border-subtle); height: 760px;">
    
    <!-- Top Header -->
    <div class="px-5 pt-4 pb-2 flex items-center justify-between border-b" style="border-color: var(--color-border-subtle);">
      <div>
        <h1 data-i18n="alertsPage.title" class="font-black text-xl leading-tight text-[var(--color-text-primary)]"></h1>
        <p data-i18n="alertsPage.subtitle" class="text-xs font-semibold text-[var(--color-text-secondary)]">Proactive Stock Alerts &amp; Voice Assistant</p>
      </div>
      <div class="w-8 h-8 rounded-full bg-blue-50 border flex items-center justify-center text-blue-700 font-black text-xs" style="border-color: var(--color-border-subtle);">
        AI
      </div>
    </div>

    <!-- Scrollable Middle Section: Alerts + Chat Thread -->
    <div id="scrollCanvas" class="flex-1 overflow-y-auto p-4 space-y-5 pb-28">
      
      <!-- TOP SECTION: "NEEDS ATTENTION" ALERT STACK -->
      <section id="alertSection" class="space-y-2.5">
        
        <!-- Active Alerts Mode -->
        <div id="activeAlertsGroup" class="space-y-2.5">
          <div class="flex items-center justify-between text-xs font-extrabold text-[var(--color-text-primary)]">
            <span data-i18n="alertsPage.needsAttention"></span>
            <span id="criticalBadge" class="hidden px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 text-[10px] font-black uppercase">
              <span id="criticalCount">0</span> <span data-i18n="alertsPage.critical">Critical</span>
            </span>
          </div>

          <!-- Dynamic Alert Cards Container -->
          <div id="alertsListContainer" class="space-y-2.5">
            <!-- Populated live from GET /api/stock/low -->
          </div>
        </div>

        <!-- Empty State Mode: All Stock Levels Look Healthy -->
        <div id="healthyStateGroup" class="hidden p-4 rounded-2xl border bg-emerald-50/80 flex items-center gap-3.5 shadow-sm" style="border-width: var(--border-width); border-color: var(--color-stock-green);">
          <div class="w-11 h-11 rounded-xl bg-emerald-600 text-white flex-shrink-0 flex items-center justify-center shadow">
            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
          </div>
          <div>
            <h3 data-i18n="alertsPage.allHealthyTitle" class="font-black text-sm text-emerald-950">
              All stock levels look healthy
            </h3>
            <p data-i18n="alertsPage.allHealthySubtitle" class="text-[11px] text-emerald-700 font-semibold mt-0.5">No products require immediate reordering.</p>
          </div>
        </div>

      </section>

      <!-- MIDDLE SECTION: CONVERSATIONAL Q&A CHAT THREAD -->
      <section class="space-y-3 pt-2 border-t" style="border-color: var(--color-border-subtle);">
        
        <div class="flex items-center justify-between text-xs font-extrabold text-[var(--color-text-secondary)]">
          <span data-i18n="alertsPage.inquiriesTitle"></span>
          <span data-i18n="alertsPage.today" class="text-[10px] text-slate-400 font-semibold">Today</span>
        </div>

        <!-- Dynamic Chat Messages / Empty State -->
        <div id="chatThreadContainer" class="space-y-3">
          <!-- Populated dynamically or shows kirana shelf empty state -->
        </div>

      </section>

    </div>

    <!-- BOTTOM SECTION: FIXED VOICE INPUT ACTION HUB -->
    <div class="absolute bottom-16 left-0 right-0 p-3 bg-gradient-to-t from-white via-white/95 to-transparent flex flex-col items-center justify-center z-20">
      
      <div class="flex items-center gap-3">
        <!-- Prominent Mic Button (68px) Consistent with Home Screen -->
        <button id="alertsMicBtn" onclick="handleAlertsMicToggle()" class="mic-shadow w-16 h-16 rounded-full flex items-center justify-center text-white cursor-pointer transition-transform active:scale-92" style="background-color: var(--color-primary-blue); border: var(--border-width) solid #000000;" aria-label="Tap to ask inventory question">
          <svg id="micIcon" class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>

        <div class="text-left">
          <div data-i18n="alertsPage.askStockSathi" class="font-extrabold text-sm text-[var(--color-text-primary)]"></div>
          <div data-i18n="alertsPage.askExample" class="text-[11px] font-semibold text-[var(--color-text-secondary)]"></div>
        </div>
      </div>

    </div>

    <!-- Bottom Tab Bar (Alerts Active) -->
    <footer class="h-16 border-t flex items-center justify-around px-2 relative z-10" style="background-color: var(--color-bg-surface); border-color: var(--color-border-subtle); border-width: var(--border-width) 0 0 0;">
      
      <!-- Tab 1: Home -->
      <button onclick="window.location.href='stocksathi_home_dashboard.html'" class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 hover:text-slate-600 cursor-pointer">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span data-i18n="nav.home" class="text-[11px] font-medium mt-0.5">Home</span>
      </button>

      <!-- Tab 2: Inventory -->
      <button onclick="window.location.href='stocksathi_inventory_tab.html'" class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 hover:text-slate-600 cursor-pointer">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
        </svg>
        <span data-i18n="nav.inventory" class="text-[11px] font-medium mt-0.5">Inventory</span>
      </button>

      <!-- Tab 3: Alerts (Active with Top Indicator) -->
      <button class="flex flex-col items-center justify-center flex-1 h-full relative cursor-pointer" style="color: var(--color-primary-blue);">
        <div class="absolute top-0 w-8 h-1 rounded-full" style="background-color: var(--color-primary-blue);"></div>
        <div class="relative">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
          </svg>
          <span id="alertsTabDot" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-600 border-2 border-white rounded-full"></span>
        </div>
        <span data-i18n="nav.alerts" class="text-[11px] font-extrabold mt-0.5">Alerts</span>
      </button>

      <!-- Tab 4: Settings -->
      <button onclick="window.location.href='stocksathi_settings.html'" class="flex flex-col items-center justify-center flex-1 h-full text-slate-400 hover:text-slate-600 cursor-pointer">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        <span data-i18n="nav.settings" class="text-[11px] font-medium mt-0.5">Settings</span>
      </button>

    </footer>

  </main>

  <script>
    let isSunlight = false;
    let currentAlertTab = 'active';
    let cachedLowProducts = [];
    let cachedReorderProducts = [];
    let cachedAllProducts = [];

    const STORAGE_QUERY_KEY = 'stocksathi_query_history';

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getQueryHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_QUERY_KEY)) || [];
      } catch (_) {
        return [];
      }
    }

    function saveQueryHistory(items) {
      try {
        localStorage.setItem(STORAGE_QUERY_KEY, JSON.stringify(items.slice(-20)));
      } catch (_) {}
    }

    function setAlertState(state) {
      currentAlertTab = state;
      const activeGroup = document.getElementById('activeAlertsGroup');
      const healthyGroup = document.getElementById('healthyStateGroup');
      const btnActive = document.getElementById('btn-active');
      const btnHealthy = document.getElementById('btn-healthy');

      if (state === 'active') {
        if (activeGroup) activeGroup.classList.remove('hidden');
        if (healthyGroup) healthyGroup.classList.add('hidden');
        if (btnActive) btnActive.className = 'py-1.5 rounded-lg bg-white shadow text-rose-800 font-bold cursor-pointer';
        if (btnHealthy) btnHealthy.className = 'py-1.5 rounded-lg text-slate-700 font-medium cursor-pointer';
      } else {
        if (activeGroup) activeGroup.classList.add('hidden');
        if (healthyGroup) healthyGroup.classList.remove('hidden');
        if (btnHealthy) btnHealthy.className = 'py-1.5 rounded-lg bg-white shadow text-emerald-800 font-bold cursor-pointer';
        if (btnActive) btnActive.className = 'py-1.5 rounded-lg text-slate-700 font-medium cursor-pointer';
      }
    }

    async function loadAlertsData() {
      if (!window.VI || !window.VI.api) return;

      try {
        const [lowData, reorderData, allProducts] = await Promise.all([
          window.VI.api('/stock/low').catch(() => []),
          window.VI.api('/stock/reorder').catch(() => []),
          window.VI.api('/products').catch(() => [])
        ]);

        cachedLowProducts = Array.isArray(lowData) ? lowData : [];
        cachedReorderProducts = Array.isArray(reorderData) ? reorderData : [];
        cachedAllProducts = Array.isArray(allProducts) ? allProducts : [];

        renderAlerts();
      } catch (err) {
        console.error('[alerts] Error loading stock data:', err);
      }
    }

    function renderAlerts() {
      const listContainer = document.getElementById('alertsListContainer');
      const criticalBadge = document.getElementById('criticalBadge');
      const criticalCountEl = document.getElementById('criticalCount');
      const activeCountBadge = document.getElementById('activeCountBadge');
      const healthyCountBadge = document.getElementById('healthyCountBadge');
      const tabDot = document.getElementById('alertsTabDot');

      const totalProducts = cachedAllProducts.length;
      const lowCount = cachedLowProducts.length;
      const healthyCount = Math.max(0, totalProducts - lowCount);

      if (activeCountBadge) activeCountBadge.textContent = lowCount;
      if (healthyCountBadge) healthyCountBadge.textContent = healthyCount;

      const criticalItems = cachedLowProducts.filter(p => Number(p.current_qty) <= 0);
      if (criticalCountEl) criticalCountEl.textContent = criticalItems.length;

      if (tabDot) {
        if (lowCount > 0) {
          tabDot.classList.remove('hidden');
        } else {
          tabDot.classList.add('hidden');
        }
      }

      if (criticalBadge) {
        if (criticalItems.length > 0) {
          criticalBadge.classList.remove('hidden');
        } else {
          criticalBadge.classList.add('hidden');
        }
      }

      if (lowCount === 0) {
        setAlertState('healthy');
        if (listContainer) listContainer.innerHTML = '';
        return;
      }

      if (currentAlertTab === 'active') {
        setAlertState('active');
      }

      const t = window.VI?.i18n?.t || ((k) => k);

      if (listContainer) {
        listContainer.innerHTML = cachedLowProducts.map(p => {
          const isOut = Number(p.current_qty) <= 0;
          const reorderMatch = cachedReorderProducts.find(r => r.id === p.id);
          const unit = escapeHtml(p.base_unit || '');
          const name = escapeHtml(p.name || '');

          if (isOut) {
            const outLabel = t('inventory.statusOutOfStock') || 'Out of Stock';
            const critLabel = t('alertsPage.critical') || 'Critical';
            return `
              <div class="p-3.5 rounded-2xl border bg-white flex items-center justify-between gap-3 shadow-sm border-l-4 border-l-red-600 cursor-pointer transition active:scale-[0.99]"
                   style="border-width: var(--border-width); border-left-width: 5px; border-color: var(--color-border-subtle); border-left-color: var(--color-stock-red);"
                   onclick="window.location.href='stocksathi_product_detail.html?id=' + encodeURIComponent('${p.id}')">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-12 h-12 rounded-xl bg-red-50 border border-red-200 flex-shrink-0 flex items-center justify-center text-red-700 font-bold text-xs">
                    ${unit}
                  </div>
                  <div class="min-w-0">
                    <h3 class="font-extrabold text-sm leading-snug text-[var(--color-text-primary)] truncate">${name}</h3>
                    <div class="font-black text-sm text-red-700 mt-0.5">0 ${unit} (${escapeHtml(outLabel)})</div>
                  </div>
                </div>
                <span class="px-2.5 py-1 rounded-full text-xs font-extrabold flex-shrink-0" style="background-color: var(--color-stock-red-bg); color: var(--color-stock-red);">
                  ${escapeHtml(critLabel)}
                </span>
              </div>
            `;
          } else {
            const lowLabel = t('inventory.statusLowStock') || 'Low Stock';
            const orderSoonLabel = t('alertsPage.orderSoon') || 'Order soon';
            let detailLine = `${p.current_qty} ${unit} (${escapeHtml(lowLabel)})`;

            if (reorderMatch && reorderMatch.days_of_stock_left !== null) {
              const daysText = t('alerts.daysLeft', { days: reorderMatch.days_of_stock_left }) || `${reorderMatch.days_of_stock_left} days left`;
              detailLine = `${p.current_qty} ${unit} • ~${escapeHtml(daysText)}`;
            }

            const suggestedHtml = (reorderMatch && reorderMatch.suggested_reorder_qty)
              ? `<div class="text-[10px] font-bold text-amber-700 mt-0.5">+${reorderMatch.suggested_reorder_qty} ${unit} suggested</div>`
              : '';

            return `
              <div class="p-3.5 rounded-2xl border bg-white flex items-center justify-between gap-3 shadow-sm border-l-4 border-l-amber-500 cursor-pointer transition active:scale-[0.99]"
                   style="border-width: var(--border-width); border-left-width: 5px; border-color: var(--color-border-subtle); border-left-color: var(--color-stock-amber);"
                   onclick="window.location.href='stocksathi_product_detail.html?id=' + encodeURIComponent('${p.id}')">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-12 h-12 rounded-xl bg-yellow-50 border border-amber-200 flex-shrink-0 flex items-center justify-center font-bold text-xs text-amber-800">
                    ${unit}
                  </div>
                  <div class="min-w-0">
                    <h3 class="font-extrabold text-sm leading-snug text-[var(--color-text-primary)] truncate">${name}</h3>
                    <div class="font-black text-sm text-amber-900 mt-0.5">${detailLine}</div>
                    ${suggestedHtml}
                  </div>
                </div>
                <span class="px-2.5 py-1 rounded-full text-xs font-extrabold flex-shrink-0" style="background-color: var(--color-stock-amber-bg); color: var(--color-stock-amber);">
                  ${escapeHtml(orderSoonLabel)}
                </span>
              </div>
            `;
          }
        }).join('');
      }
    }

    function renderHistory() {
      const container = document.getElementById('chatThreadContainer');
      if (!container) return;

      const history = getQueryHistory();
      const t = window.VI?.i18n?.t || ((k) => k);

      if (history.length === 0) {
        // Reuse Inventory screen kirana shelf empty state pattern
        container.innerHTML = `
          <div class="p-4 text-center space-y-3">
            <div class="w-36 h-24 rounded-2xl bg-amber-50/80 border flex flex-col items-center justify-center p-2.5 relative shadow-inner mx-auto" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
              <div class="w-28 h-2 bg-amber-200 rounded-full mb-2"></div>
              <div class="w-28 h-2 bg-amber-200 rounded-full mb-2"></div>
              <div class="w-28 h-2 bg-amber-300 rounded-full"></div>
              <div class="absolute -top-3 bg-white px-2.5 py-0.5 rounded-full border shadow-md flex items-center gap-1.5 text-xs font-bold text-orange-600" style="border-color: var(--color-border-subtle);">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg>
                <span>${escapeHtml(t('inventory.speak') || 'Speak!')}</span>
              </div>
            </div>
            <div>
              <h3 class="font-black text-sm text-[var(--color-text-primary)]">
                ${escapeHtml(t('alertsPage.emptyHistoryTitle') || 'No questions yet')}
              </h3>
              <p class="text-xs text-[var(--color-text-secondary)] mt-0.5 max-w-[240px] mx-auto">
                ${escapeHtml(t('alertsPage.emptyHistorySubtitle') || 'Tap the mic below to ask StockSathi about your inventory.')}
              </p>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = history.map(item => {
        const q = escapeHtml(item.question);
        const ans = escapeHtml(item.response);
        const readoutHeader = escapeHtml(t('alertsPage.voiceReadout') || 'StockSathi Voice Readout:');

        let cardHtml = '';
        if (item.product) {
          const p = item.product;
          const pUnit = escapeHtml(p.base_unit || '');
          const pName = escapeHtml(p.name || '');
          const pQty = p.current_qty ?? 0;
          const pThresh = p.low_stock_threshold ?? 0;
          const isLow = Number(pQty) <= Number(pThresh);
          const tagText = isLow
            ? (t('alertsPage.orderSoon') || 'Order soon')
            : (t('alertsPage.healthyTag') || 'Healthy');
          const tagStyle = isLow
            ? 'bg-amber-100 text-amber-900'
            : 'bg-emerald-100 text-emerald-800';

          cardHtml = `
            <div class="p-2.5 rounded-xl bg-slate-50 border flex items-center justify-between gap-3 shadow-inner cursor-pointer mt-2"
                 style="border-color: var(--color-border-subtle);"
                 onclick="window.location.href='stocksathi_product_detail.html?id=' + encodeURIComponent('${p.id}')">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-10 h-10 rounded-lg bg-amber-100 flex items-center justify-center text-amber-900 border border-amber-200 flex-shrink-0 font-bold text-xs">
                  ${pUnit}
                </div>
                <div class="min-w-0">
                  <div class="font-extrabold text-xs text-slate-900 truncate">${pName}</div>
                  <div class="text-[10px] font-semibold text-slate-500">Reorder limit: ${pThresh} ${pUnit}</div>
                </div>
              </div>
              <div class="text-right flex-shrink-0">
                <div class="font-black text-sm text-slate-900">${pQty} ${pUnit}</div>
                <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-extrabold ${tagStyle}">
                  ${escapeHtml(tagText)}
                </span>
              </div>
            </div>
          `;
        }

        return `
          <div class="space-y-2">
            <div class="flex justify-end">
              <div class="bubble-user max-w-[80%] p-3 text-xs font-extrabold border" style="background-color: var(--chat-user-bg); color: var(--chat-user-text); border-color: var(--color-border-subtle);">
                ${q}
              </div>
            </div>
            <div class="flex justify-start">
              <div class="bubble-system max-w-[90%] p-3.5 text-xs bg-white border shadow-sm space-y-2" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
                <div class="flex items-center gap-1.5 text-blue-700 font-extrabold text-[11px]">
                  <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                  <span>${readoutHeader}</span>
                </div>
                <p class="font-semibold text-slate-800 text-xs leading-relaxed">
                  ${ans}
                </p>
                ${cardHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function submitQuestion(questionText) {
      if (!questionText || !questionText.trim()) return;
      const q = questionText.trim();

      const t = window.VI?.i18n?.t || ((k) => k);
      const langCode = window.VI?.i18n ? window.VI.i18n.getLang() : 'hi';

      try {
        const parseResult = await window.VI.api('/parse', {
          method: 'POST',
          body: { text: q, lang: langCode }
        });

        let answer = '';
        let productInfo = null;

        if (parseResult.action === 'query_stock') {
          const item = parseResult.items?.[0];
          const prodId = item?.matched?.id;

          if (prodId) {
            const [prod, reorderList] = await Promise.all([
              window.VI.api('/stock/' + prodId),
              window.VI.api('/stock/reorder').catch(() => [])
            ]);

            const reorderItem = (reorderList || []).find(r => r.id === prod.id);

            if (reorderItem && reorderItem.days_of_stock_left !== null) {
              answer = t('query.stockWithDays', {
                name: prod.name,
                qty: prod.current_qty,
                unit: prod.base_unit,
                days: reorderItem.days_of_stock_left
              });
            } else {
              answer = t('query.stockResult', {
                name: prod.name,
                qty: prod.current_qty,
                unit: prod.base_unit
              });
            }

            if (reorderItem && reorderItem.suggested_reorder_qty) {
              const reorderText = t('query.reorderRecommendation', {
                list: `${prod.name} (${reorderItem.suggested_reorder_qty} ${prod.base_unit})`
              });
              answer += ' ' + reorderText;
            }

            productInfo = {
              id: prod.id,
              name: prod.name,
              current_qty: prod.current_qty,
              base_unit: prod.base_unit,
              low_stock_threshold: prod.low_stock_threshold,
              days_of_stock_left: reorderItem?.days_of_stock_left ?? null,
              suggested_reorder_qty: reorderItem?.suggested_reorder_qty ?? null
            };
          } else {
            answer = t('toast.selectProductFirst') || 'Could not identify product.';
          }
        } else if (parseResult.action === 'query_low') {
          const reorderList = await window.VI.api('/stock/reorder').catch(() => []);
          if (!reorderList || reorderList.length === 0) {
            answer = t('query.noLowStock') || 'All stock levels are healthy!';
          } else {
            const listStr = reorderList.map(p => `${p.name} (${p.current_qty} ${p.base_unit})`).join(', ');
            answer = t('query.lowStockSummary', {
              count: reorderList.length,
              items: listStr
            });
          }
        } else {
          answer = t('query.noLowStock') || 'No matching stock information found.';
        }

        const history = getQueryHistory();
        history.push({
          id: 'q-' + Date.now(),
          question: q,
          response: answer,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          product: productInfo
        });
        saveQueryHistory(history);
        renderHistory();

        if (window.VI && window.VI.tts) {
          window.VI.tts.speak(answer, langCode);
        }

        const canvas = document.getElementById('scrollCanvas');
        if (canvas) canvas.scrollTop = canvas.scrollHeight;
      } catch (err) {
        console.error('[alerts] submitQuestion error:', err);
      }
    }

    function handleAlertsMicToggle() {
      const speech = window.VI && window.VI.speech;
      const micBtn = document.getElementById('alertsMicBtn');

      if (!speech || !speech.isSupported()) {
        const placeholder = window.VI?.i18n ? window.VI.i18n.t('voice.inputPlaceholder') : 'Ask a question...';
        const q = prompt(placeholder, '');
        if (q) submitQuestion(q);
        return;
      }

      if (speech.isListening()) {
        speech.stopListening();
        if (micBtn) {
          micBtn.style.backgroundColor = 'var(--color-primary-blue)';
          micBtn.classList.remove('animate-pulse');
        }
      } else {
        if (micBtn) {
          micBtn.style.backgroundColor = 'var(--color-warm-accent)';
          micBtn.classList.add('animate-pulse');
        }

        const speechLang = window.VI.i18n ? window.VI.i18n.getSpeechLang() : 'hi-IN';
        speech.startListening(speechLang);
      }
    }

    function toggleSunlightMode() {
      isSunlight = !isSunlight;
      const html = document.documentElement;
      const btn = document.getElementById('sunlightBtn');
      const label = document.getElementById('sunlightLabel');

      if (isSunlight) {
        html.setAttribute('data-theme', 'outdoor');
        label.textContent = "Normal Mode";
        btn.classList.add('bg-black', 'text-white');
      } else {
        html.removeAttribute('data-theme');
        label.textContent = "Sunlight Mode";
        btn.classList.remove('bg-black', 'text-white');
      }
    }

    function initAlertsPage() {
      loadAlertsData();
      renderHistory();

      if (window.VI && window.VI.i18n) {
        window.VI.i18n.onLangChange(() => {
          renderAlerts();
          renderHistory();
        });
      }

      const speech = window.VI && window.VI.speech;
      if (speech) {
        speech.onFinal((transcript) => {
          const micBtn = document.getElementById('alertsMicBtn');
          if (micBtn) {
            micBtn.style.backgroundColor = 'var(--color-primary-blue)';
            micBtn.classList.remove('animate-pulse');
          }
          submitQuestion(transcript);
        });

        speech.onError((code, details) => {
          const micBtn = document.getElementById('alertsMicBtn');
          if (micBtn) {
            micBtn.style.backgroundColor = 'var(--color-primary-blue)';
            micBtn.classList.remove('animate-pulse');
          }
        });

        speech.onEnd(() => {
          const micBtn = document.getElementById('alertsMicBtn');
          if (micBtn) {
            micBtn.style.backgroundColor = 'var(--color-primary-blue)';
            micBtn.classList.remove('animate-pulse');
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAlertsPage);
    } else {
      initAlertsPage();
    }
  </script>
</body>
</html>
