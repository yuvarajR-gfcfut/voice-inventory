<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSathi - Home Voice Dashboard</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style id="auth-guard">html { visibility: hidden; }</style>
  <script src="/vendor/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/speech.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/tts.js"></script>
  <script>
    window.VI.auth.requireSession().then(async (session) => {
      if (!session) return;
      try {
        const me = await window.VI.api('/me');
        if (me && me.shop_name) {
          const el = document.getElementById('dashboardShopName');
          if (el) el.textContent = me.shop_name;
          const av = document.getElementById('dashboardAvatar');
          if (av) av.textContent = me.shop_name.slice(0, 2).toUpperCase();
        }
      } catch (_) {}
    });
  </script>
  <style>
    :root {
      --font-family-base: 'Baloo 2', system-ui, -apple-system, sans-serif;
      --color-primary-blue: #1D4ED8;
      --color-primary-blue-hover: #1E40AF;
      --color-warm-accent: #EA580C;
      --color-warm-accent-hover: #C2410C;
      --color-stock-green: #15803D;
      --color-stock-green-bg: #DCFCE7;
      --color-stock-amber: #B45309;
      --color-stock-amber-bg: #FEF3C7;
      --color-stock-red: #B91C1C;
      --color-stock-red-bg: #FEE2E2;
      --color-bg-app: #F8FAFC;
      --color-bg-surface: #FFFFFF;
      --color-text-primary: #0F172A;
      --color-text-secondary: #64748B;
      --color-border-subtle: #E2E8F0;
      --color-border-strong: #0F172A;
      --border-width: 1.5px;
      --shadow-fab-idle: 0 8px 24px rgba(29, 78, 216, 0.28);
      --shadow-fab-listening: 0 10px 30px rgba(234, 88, 12, 0.45);
    }

    [data-theme="outdoor"] {
      --color-primary-blue: #0C2366;
      --color-primary-blue-hover: #081744;
      --color-warm-accent: #C2410C;
      --color-warm-accent-hover: #9A3412;
      --color-stock-green: #054F26;
      --color-stock-green-bg: #FFFFFF;
      --color-stock-amber: #78350F;
      --color-stock-amber-bg: #FFFFFF;
      --color-stock-red: #7F1D1D;
      --color-stock-red-bg: #FFFFFF;
      --color-bg-app: #FFFFFF;
      --color-bg-surface: #FFFFFF;
      --color-text-primary: #000000;
      --color-text-secondary: #1E293B;
      --color-border-subtle: #000000;
      --color-border-strong: #000000;
      --border-width: 2.5px;
      --shadow-fab-idle: 0 0 0 4px #000000;
      --shadow-fab-listening: 0 0 0 5px #C2410C;
    }

    body {
      font-family: var(--font-family-base);
      background-color: var(--color-bg-app);
      color: var(--color-text-primary);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body.font-devanagari, .font-devanagari {
      font-family: 'Noto Sans Devanagari', var(--font-family-base) !important;
    }

    body.font-telugu, .font-telugu {
      font-family: 'Noto Sans Telugu', var(--font-family-base) !important;
    }

    /* Waveform and sonar pulses */
    @keyframes sonarPulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.65); opacity: 0; }
    }

    .sonar-wave {
      animation: sonarPulse 1.3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }

    @keyframes barBounce {
      0%, 100% { height: 12px; }
      50% { height: 32px; }
    }

    .wave-bar {
      animation: barBounce 0.8s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bar:nth-child(5) { animation-delay: 0.2s; }

    @keyframes spinDual {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner-ring {
      animation: spinDual 1.1s linear infinite;
    }

    .fade-rotate {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
  </style>
</head>
<body class="min-h-screen p-2 sm:p-4 flex flex-col items-center justify-start">
  
  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl font-bold text-xs shadow-xl transition-all duration-300 z-50 max-w-[90vw] text-center opacity-0 pointer-events-none"></div>

  <!-- State Controller Bar (Sunlight Mode Toggle) -->
  <div class="w-full max-w-sm mb-2 flex items-center justify-between px-2 text-xs font-bold">
    <span class="text-blue-900 bg-blue-100/90 px-2.5 py-1 rounded-full font-black text-[11px]">StockSathi • Voice</span>
    <button onclick="toggleOutdoorTheme()" id="outdoorBtn" class="px-2.5 py-1 rounded-xl border bg-white shadow-xs flex items-center gap-1.5 cursor-pointer active:scale-95">
      <span>☀️</span>
      <span id="outdoorText">Sunlight Mode</span>
    </button>
  </div>

  <!-- Mobile Viewport Frame -->
  <main class="w-full max-w-sm bg-[var(--color-bg-surface)] rounded-3xl border shadow-2xl relative overflow-hidden flex flex-col justify-between" style="border-width: var(--border-width); border-color: var(--color-border-subtle); min-height: 720px;">
    
    <!-- Zone 1: Unobtrusive Header -->
    <header class="pt-4 px-5 pb-2 flex items-center justify-between border-b" style="border-color: var(--color-border-subtle);">
      <div>
        <h1 id="dashboardShopName" class="font-extrabold text-base tracking-tight leading-tight text-[var(--color-text-primary)]">
          माँ लक्ष्मी किराना स्टोर्स
        </h1>
        <p id="dashboardSubtitle" data-i18n="app.subtitle" class="text-xs font-semibold text-[var(--color-text-secondary)] mt-0.5">
          बोलकर स्टॉक प्रबंधित करें
        </p>
      </div>
      <div id="dashboardAvatar" onclick="window.VI.auth.signOut()" title="Sign Out / Log Out" class="w-8 h-8 rounded-full flex items-center justify-center bg-slate-100 text-slate-700 text-xs font-bold border cursor-pointer hover:bg-slate-200 active:scale-95 transition-all" style="border-color: var(--color-border-subtle);">
        ML
      </div>
    </header>

    <!-- EXCLUSIVE HOME PAGE ACCESSIBLE LANGUAGE SELECTOR (Requirement: only one language at a time in all sections, only on home page) -->
    <div class="px-4 pt-2.5 pb-1 w-full flex-shrink-0">
      <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 rounded-2xl text-xs font-black text-center border border-slate-200 shadow-inner">
        <button type="button" onclick="switchAppLanguage('hi')" id="lang-btn-hi" class="py-2 rounded-xl text-slate-700 font-semibold cursor-pointer transition-all active:scale-95 flex items-center justify-center gap-1">
          <span>🇮🇳</span><span>हिन्दी</span>
        </button>
        <button type="button" onclick="switchAppLanguage('en')" id="lang-btn-en" class="py-2 rounded-xl text-slate-700 font-semibold cursor-pointer transition-all active:scale-95 flex items-center justify-center gap-1">
          <span>🇬🇧</span><span>English</span>
        </button>
        <button type="button" onclick="switchAppLanguage('te')" id="lang-btn-te" class="py-2 rounded-xl text-slate-700 font-semibold cursor-pointer transition-all active:scale-95 flex items-center justify-center gap-1">
          <span>🇮🇳</span><span>తెలుగు</span>
        </button>
      </div>
    </div>

    <!-- Low Stock Alert Banner (Phase 3.7) -->
    <div id="lowStockBanner" class="hidden mx-4 mt-1.5 p-2.5 rounded-2xl border bg-amber-50 border-amber-300 text-amber-950 flex items-center justify-between shadow-xs flex-shrink-0">
      <div class="flex items-center gap-2 truncate">
        <span class="text-base">⚠️</span>
        <span id="lowStockBannerText" class="font-bold text-xs truncate">Low stock items</span>
      </div>
      <button onclick="window.location.href='stocksathi_alerts_tab.html'" class="px-2.5 py-1 bg-amber-200 hover:bg-amber-300 text-amber-900 rounded-xl text-[10px] font-black uppercase flex-shrink-0 cursor-pointer">
        <span data-i18n="alerts.viewAlerts">View</span> →
      </button>
    </div>

    <!-- Query Answer Result Card (Phase 3.7) -->
    <div id="queryResultCard" class="hidden mx-4 mt-1.5 p-3 rounded-2xl border bg-blue-50 border-blue-300 text-blue-950 flex items-start justify-between shadow-md flex-shrink-0">
      <div class="flex items-start gap-2.5">
        <span class="text-lg">📢</span>
        <div>
          <div class="text-[10px] font-extrabold uppercase tracking-wide text-blue-700">StockSathi Voice Readout</div>
          <div id="queryResultText" class="text-xs font-bold text-slate-900 mt-0.5 leading-snug"></div>
        </div>
      </div>
      <button onclick="document.getElementById('queryResultCard').classList.add('hidden')" class="text-slate-400 hover:text-slate-700 text-sm font-black p-0.5 cursor-pointer">✕</button>
    </div>

    <!-- Center Interactive Hub: Voice Hero Element -->
    <section class="flex-1 flex flex-col items-center justify-center px-6 py-2 -mt-1">
      
      <!-- Dominant Circular Mic Button (96px) -->
      <div class="relative flex items-center justify-center mb-3">
        
        <!-- Sonar Rings for Listening State -->
        <div id="sonarRing1" class="absolute w-28 h-28 rounded-full opacity-0 pointer-events-none" style="background-color: var(--color-warm-accent);"></div>
        <div id="sonarRing2" class="absolute w-28 h-28 rounded-full opacity-0 pointer-events-none" style="background-color: var(--color-warm-accent); animation-delay: 0.45s;"></div>
        
        <!-- Spinner Ring for Processing State -->
        <div id="spinnerRing" class="absolute w-28 h-28 rounded-full border-4 border-transparent border-t-blue-600 border-r-blue-400 opacity-0 pointer-events-none spinner-ring"></div>

        <!-- The Hero 96px Button (Reused Milestone-1 element) -->
        <button id="mainMicButton" onclick="handleMicToggle()" class="w-24 h-24 rounded-full flex items-center justify-center text-white cursor-pointer relative z-10 transition-all duration-200 active:scale-92" style="background-color: var(--color-primary-blue); box-shadow: var(--shadow-fab-idle);" aria-label="Tap to speak inventory command">
          
          <!-- State 1: Solid Microphone Icon (Idle) -->
          <svg id="iconMicSolid" class="w-11 h-11 transition-transform" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>

          <!-- State 2: Active Audio Waveform Bars (Listening) -->
          <div id="iconWaveform" class="hidden flex items-center justify-center gap-1.5 h-10">
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
          </div>

          <!-- State 3: Thinking Dots (Processing) -->
          <div id="iconProcessing" class="hidden text-xs font-black tracking-widest uppercase">
            ...
          </div>

          <!-- State 4: Retry / Reload Arrow (Error) -->
          <svg id="iconRetry" class="hidden w-10 h-10" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>

        </button>
      </div>

      <!-- State Feedback Message Banner -->
      <div class="h-8 flex items-center justify-center text-center px-4">
        
        <!-- Idle Label -->
        <span id="labelIdle" data-i18n="voice.tapToSpeak" class="text-xs font-bold px-3 py-1 rounded-full border bg-slate-50 text-slate-700" style="border-color: var(--color-border-subtle);">
          बोलने के लिए दबाएं
        </span>

        <!-- Listening Label -->
        <span id="labelListening" data-i18n="voice.listening" class="hidden text-xs font-extrabold px-3 py-1 rounded-full text-white bg-[#EA580C] shadow-sm animate-pulse">
          सुन रहा हूँ...
        </span>

        <!-- Processing Label -->
        <div id="labelProcessing" class="hidden flex items-center gap-1.5 text-xs font-extrabold text-blue-900 bg-blue-50 px-3 py-1 rounded-full border border-blue-200">
          <span class="w-2 h-2 rounded-full bg-blue-600 animate-ping"></span>
          <span data-i18n="voice.processing">समझ रहा हूँ...</span>
        </div>

        <!-- Error State Retry Label -->
        <div id="labelError" class="hidden flex items-center gap-1.5 text-xs font-extrabold text-amber-900 bg-amber-50 px-3 py-1 rounded-full border border-amber-300 shadow-sm cursor-pointer" onclick="handleMicToggle()">
          <span>⚠️</span>
          <span data-i18n="confirm.tryAgain">दोबारा कोशिश करें</span>
        </div>

      </div>

      <!-- Zone 3: Learning-by-Example Line -->
      <div class="mt-2 w-full flex justify-center">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100/90 border text-xs font-medium text-slate-800 transition-all cursor-pointer" style="border-color: var(--color-border-subtle);" onclick="rotateExamplePhrase()">
          <span class="text-xs">🗣️</span>
          <span id="examplePhrase" class="fade-rotate font-semibold text-[11px]">"5 किलो चीनी आई"</span>
          <span class="text-[10px] text-slate-400">↻</span>
        </div>
      </div>

      <!-- Zone 4: Today's Snapshot Stats Row -->
      <div class="mt-3 w-full grid grid-cols-3 gap-2">
        
        <!-- Stat 1: Total Products -->
        <div class="p-2 rounded-2xl border text-center flex flex-col justify-between" style="background-color: var(--color-bg-surface); border-width: var(--border-width); border-color: var(--color-border-subtle);">
          <div class="w-4 h-1 bg-slate-300 rounded-full mx-auto mb-1"></div>
          <div id="statTotalProducts" class="font-extrabold text-xl text-[var(--color-text-primary)]">0</div>
          <div data-i18n="stats.totalProducts" class="text-[10px] font-bold text-[var(--color-text-secondary)] leading-tight truncate">कुल सामान</div>
        </div>

        <!-- Stat 2: Low Stock (Amber Badge) with Days of Stock Left -->
        <div class="p-2 rounded-2xl border text-center flex flex-col justify-between cursor-pointer" onclick="window.location.href='stocksathi_alerts_tab.html'" style="background-color: var(--color-stock-amber-bg); border-width: var(--border-width); border-color: var(--color-stock-amber);">
          <div class="flex items-center justify-center gap-1 text-[10px] font-bold text-[#78350F]">
            <span>⚠️</span>
            <span data-i18n="stats.lowStock">कम स्टॉक</span>
          </div>
          <div id="statLowStock" class="font-extrabold text-xl text-[#78350F]">0</div>
          <div id="statLowStockDays" class="text-[10px] font-black text-[#78350F] leading-tight truncate">—</div>
        </div>

        <!-- Stat 3: Out of Stock (Red Badge) -->
        <div class="p-2 rounded-2xl border text-center flex flex-col justify-between cursor-pointer" onclick="window.location.href='stocksathi_alerts_tab.html'" style="background-color: var(--color-stock-red-bg); border-width: var(--border-width); border-color: var(--color-stock-red);">
          <div class="flex items-center justify-center gap-1 text-[10px] font-bold text-[#7F1D1D]">
            <span>✕</span>
            <span data-i18n="alerts.outOfStock">खत्म माल</span>
          </div>
          <div id="statOutOfStock" class="font-extrabold text-xl text-[#7F1D1D]">0</div>
          <div data-i18n="alerts.needsReorder" class="text-[10px] font-bold text-[#7F1D1D] leading-tight truncate">तुरंत मंगाएं</div>
        </div>

      </div>

      <!-- Zone 5: Typed Input Fallback (Always visible and usable) -->
      <!-- Last Action Undo Affordance (Requirement 7) -->
      <div id="undoBanner" class="hidden mt-2.5 w-full p-2.5 rounded-xl border flex items-center justify-between text-xs font-bold bg-blue-50 text-blue-900 shadow-sm" style="border-width: var(--border-width); border-color: #BFDBFE;">
        <div class="flex items-center gap-1.5 truncate">
          <span class="text-sm text-blue-700">↶</span>
          <span id="undoSummaryText" class="truncate font-semibold text-[11px]">Stock updated</span>
        </div>
        <button id="undoBtn" onclick="handleUndoLastAction()" class="ml-2 px-2.5 py-1 rounded-lg bg-white border border-blue-300 text-blue-800 font-extrabold shadow-xs hover:bg-blue-100 active:scale-95 cursor-pointer whitespace-nowrap text-[11px]">
          <span data-i18n="undo.undoBtn">वापस लें</span>
        </button>
      </div>

      <div class="mt-2.5 w-full">
        <div class="relative flex items-center">
          <input id="commandInput" type="text" data-i18n-placeholder="voice.inputPlaceholder" placeholder="कमांड लिखें या माइक दबाएं..." class="w-full h-10 pl-9 pr-3 rounded-xl border text-xs font-semibold bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 transition" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
          <span class="absolute left-3 text-slate-400 pointer-events-none">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
          </span>
        </div>
      </div>

    </section>

    <!-- Confirmation Modal Overlay (Reusing Milestone-1 Design) -->
    <div id="confirmModal" class="hidden absolute inset-0 bg-slate-900/60 z-40 flex flex-col justify-end p-2.5 backdrop-blur-xs transition-all duration-200">
      <div id="confirmCard" class="w-full bg-white rounded-3xl border p-4 shadow-2xl flex flex-col justify-between max-h-[94%] overflow-y-auto" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
        <!-- Injected dynamically by renderConfirmationCard() -->
      </div>
    </div>

    <!-- Fixed Bottom Tab Bar -->
    <footer class="h-16 border-t flex items-center justify-around px-2" style="background-color: var(--color-bg-surface); border-color: var(--color-border-subtle); border-width: var(--border-width) 0 0 0;">
      
      <!-- Tab 1: Home (Active) -->
      <button class="flex flex-col items-center justify-center flex-1 h-full relative cursor-pointer" style="color: var(--color-primary-blue);">
        <div class="absolute top-0 w-8 h-1 rounded-full" style="background-color: var(--color-primary-blue);"></div>
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span data-i18n="nav.home" class="text-[11px] font-extrabold mt-0.5">होम</span>
      </button>

      <!-- Tab 2: Inventory -->
      <button onclick="window.location.href='stocksathi_inventory_tab.html'" class="flex flex-col items-center justify-center flex-1 h-full cursor-pointer text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
        </svg>
        <span data-i18n="nav.inventory" class="text-[11px] font-medium mt-0.5">स्टॉक सूची</span>
      </button>

      <!-- Tab 3: Alerts (With Red Notification Dot) -->
      <button onclick="window.location.href='stocksathi_alerts_tab.html'" class="flex flex-col items-center justify-center flex-1 h-full cursor-pointer text-slate-400 hover:text-slate-600 transition-colors relative">
        <div class="relative">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
          </svg>
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-600 border-2 border-white rounded-full"></span>
        </div>
        <span data-i18n="nav.alerts" class="text-[11px] font-medium mt-0.5">अलर्ट</span>
      </button>

      <!-- Tab 4: Settings -->
      <button onclick="window.location.href='stocksathi_settings.html'" class="flex flex-col items-center justify-center flex-1 h-full cursor-pointer text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        <span data-i18n="nav.settings" class="text-[11px] font-medium mt-0.5"></span>
      </button>

    </footer>

  </main>

  <script>
    let currentState = 'idle';
    let isOutdoor = false;
    let currentSpeechLang = 'hi-IN';

    // Localized rotating example phrases
    const localizedPhrases = {
      hi: [
        "\"5 किलो चीनी आई\"",
        "\"2 पैकेट दूध बिका\"",
        "\"चावल कितना बचा है?\"",
        "\"कौन सा सामान कम है?\""
      ],
      en: [
        "\"5 kg sugar came\"",
        "\"sold 2 packets milk\"",
        "\"how much rice is left?\"",
        "\"what items are low?\""
      ],
      te: [
        "\"5 కిలోల చక్కెర వచ్చింది\"",
        "\"2 ప్యాకెట్ల పాలు అమ్మాము\"",
        "\"బియ్యం ఎంత మిగిలింది?\"",
        "\"ఏం సరుకులు తక్కువగా ఉన్నాయి?\""
      ]
    };
    let phrases = localizedPhrases.hi;
    let phraseIndex = 0;

    function rotateExamplePhrase() {
      if (!phrases || phrases.length === 0) return;
      phraseIndex = (phraseIndex + 1) % phrases.length;
      const el = document.getElementById('examplePhrase');
      if (!el) return;
      el.style.opacity = '0';
      el.style.transform = 'translateY(4px)';
      setTimeout(() => {
        el.textContent = phrases[phraseIndex];
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      }, 180);
    }

    setInterval(rotateExamplePhrase, 4000);

    function updateExamplePhrasesForLang(lang) {
      phrases = localizedPhrases[lang] || localizedPhrases.hi;
      phraseIndex = 0;
      const el = document.getElementById('examplePhrase');
      if (el && phrases[0]) el.textContent = phrases[0];
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.className = `fixed top-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl font-bold text-xs shadow-xl transition-all duration-300 z-50 max-w-[90vw] text-center ${
        isError ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'
      }`;
      toast.style.opacity = '1';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.style.opacity = '0';
      }, 3500);
    }

    // EXCLUSIVE SINGLE LANGUAGE SWITCHER (Requirement: only one language at a time across all sections, only on home page)
    async function switchAppLanguage(lang) {
      if (!window.VI || !window.VI.i18n) return;
      await window.VI.i18n.setLang(lang, true);
      currentSpeechLang = window.VI.i18n.getSpeechLang();

      ['hi', 'en', 'te'].forEach(l => {
        const btn = document.getElementById('lang-btn-' + l);
        if (btn) {
          if (l === lang) {
            btn.className = 'py-2 rounded-xl bg-white shadow-sm text-blue-900 font-black cursor-pointer transition-all active:scale-95 flex items-center justify-center gap-1';
          } else {
            btn.className = 'py-2 rounded-xl text-slate-700 font-semibold cursor-pointer transition-all active:scale-95 flex items-center justify-center gap-1';
          }
        }
      });

      updateExamplePhrasesForLang(lang);
      await loadDashboardStats();
    }

    function setMicState(state) {
      currentState = state;
      
      const micBtn = document.getElementById('mainMicButton');
      const sonar1 = document.getElementById('sonarRing1');
      const sonar2 = document.getElementById('sonarRing2');
      const spinner = document.getElementById('spinnerRing');

      const iconMic = document.getElementById('iconMicSolid');
      const iconWave = document.getElementById('iconWaveform');
      const iconProc = document.getElementById('iconProcessing');
      const iconRetry = document.getElementById('iconRetry');

      const lblIdle = document.getElementById('labelIdle');
      const lblListen = document.getElementById('labelListening');
      const lblProc = document.getElementById('labelProcessing');
      const lblErr = document.getElementById('labelError');

      // Reset all elements
      sonar1.classList.remove('sonar-wave');
      sonar2.classList.remove('sonar-wave');
      spinner.classList.add('opacity-0');

      iconMic.classList.add('hidden');
      iconWave.classList.add('hidden');
      iconProc.classList.add('hidden');
      iconRetry.classList.add('hidden');

      lblIdle.classList.add('hidden');
      lblListen.classList.add('hidden');
      lblProc.classList.add('hidden');
      lblErr.classList.add('hidden');

      if (state === 'idle') {
        micBtn.style.backgroundColor = 'var(--color-primary-blue)';
        micBtn.style.boxShadow = 'var(--shadow-fab-idle)';
        iconMic.classList.remove('hidden');
        lblIdle.classList.remove('hidden');
      } else if (state === 'listening') {
        micBtn.style.backgroundColor = 'var(--color-warm-accent)';
        micBtn.style.boxShadow = 'var(--shadow-fab-listening)';
        sonar1.classList.add('sonar-wave');
        sonar2.classList.add('sonar-wave');
        iconWave.classList.remove('hidden');
        lblListen.classList.remove('hidden');
      } else if (state === 'processing') {
        micBtn.style.backgroundColor = '#0C2366';
        spinner.classList.remove('opacity-0');
        iconProc.classList.remove('hidden');
        lblProc.classList.remove('hidden');
      } else if (state === 'error') {
        micBtn.style.backgroundColor = 'var(--color-primary-blue)';
        iconRetry.classList.remove('hidden');
        lblErr.classList.remove('hidden');
      }
    }

    function handleMicToggle() {
      const speech = window.VI && window.VI.speech;
      if (!speech) {
        showToast('Voice service is loading. Please try again.', true);
        document.getElementById('commandInput')?.focus();
        return;
      }

      if (speech.isListening()) {
        speech.stopListening();
        setMicState('idle');
      } else {
        if (!speech.isSupported()) {
          showToast(window.VI.i18n ? window.VI.i18n.t('toast.voiceNotSupported') : 'Voice recognition not supported', true);
          document.getElementById('commandInput')?.focus();
          return;
        }
        setMicState('listening');
        const started = speech.startListening(currentSpeechLang);
        if (!started) {
          setMicState('idle');
        }
      }
    }

    function toggleOutdoorTheme() {
      isOutdoor = !isOutdoor;
      const html = document.documentElement;
      const btn = document.getElementById('outdoorBtn');
      const txt = document.getElementById('outdoorText');

      if (isOutdoor) {
        html.setAttribute('data-theme', 'outdoor');
        txt.textContent = 'Normal Mode';
        btn.classList.add('bg-black', 'text-white');
      } else {
        html.removeAttribute('data-theme');
        txt.textContent = 'Sunlight Mode';
        btn.classList.remove('bg-black', 'text-white');
      }
      setMicState(currentState);
    }

    let userProductsCache = [];
    let parsedQueue = [];
    let currentQueueIndex = 0;
    let currentParsedAction = 'in';
    let currentRawTranscript = '';
    let currentCardIdempotencyKey = null;
    let isInlineEditing = false;
    let lastSuccessfulMovement = null;

    // Load live inventory stats & 14-day consumption metrics (Phase 3.7)
    async function loadDashboardStats() {
      try {
        const products = await window.VI.api('/products');
        if (Array.isArray(products)) {
          userProductsCache = products;
          let low = 0;
          let out = 0;
          products.forEach(p => {
            const qty = Number(p.current_qty) || 0;
            const thresh = Number(p.low_stock_threshold) || 0;
            if (qty <= 0) out++;
            else if (qty <= thresh) low++;
          });
          const totalEl = document.getElementById('statTotalProducts');
          if (totalEl) totalEl.textContent = products.length;
          const lowEl = document.getElementById('statLowStock');
          if (lowEl) lowEl.textContent = low;
          const outEl = document.getElementById('statOutOfStock');
          if (outEl) outEl.textContent = out;
        }

        // Fetch reorder data computed from past 14 days net consumption (pure DB rows, zero LLM)
        const reorders = await window.VI.api('/stock/reorder').catch(() => []);
        const banner = document.getElementById('lowStockBanner');
        const bannerText = document.getElementById('lowStockBannerText');
        if (banner && bannerText) {
          if (Array.isArray(reorders) && reorders.length > 0) {
            bannerText.textContent = window.VI.i18n ? window.VI.i18n.t('alerts.itemsLow', { count: reorders.length }) : `${reorders.length} items running low`;
            banner.classList.remove('hidden');
          } else {
            banner.classList.add('hidden');
          }
        }

        // Days of stock left: show average or min days, handle 0 usage without division by zero
        const daysEl = document.getElementById('statLowStockDays');
        if (daysEl) {
          if (Array.isArray(reorders) && reorders.length > 0) {
            const validDays = reorders
              .map(r => r.days_of_stock_left)
              .filter(d => d !== null && d > 0);
            if (validDays.length > 0) {
              const minD = Math.min(...validDays);
              const label = window.VI.i18n ? window.VI.i18n.t('alerts.daysLeft', { days: minD }) : `~${minD}d left`;
              daysEl.textContent = label;
            } else {
              daysEl.textContent = '—';
            }
          } else {
            daysEl.textContent = '—';
          }
        }
      } catch (_) {}
    }

    function showQueryResultCard(text) {
      const card = document.getElementById('queryResultCard');
      const txt = document.getElementById('queryResultText');
      if (card && txt) {
        txt.textContent = text;
        card.classList.remove('hidden');
      }
    }

    // Handle Query Stock: "sugar kitna bacha", "how much rice is left" (Phase 3.7)
    async function handleStockQuery(data) {
      const item = data.items?.[0];
      const prodId = item?.matched?.id;
      if (!prodId) {
        const msg = window.VI.i18n ? window.VI.i18n.t('toast.selectProductFirst') : 'Please select a product first';
        showToast(msg, true);
        if (window.VI.tts) window.VI.tts.speak(msg);
        return;
      }

      try {
        // Pure DB fetch from /api/stock/:productId
        const prod = await window.VI.api(`/stock/${prodId}`);
        const reorderList = await window.VI.api('/stock/reorder').catch(() => []);
        const reorderItem = reorderList.find(r => r.id === prod.id);

        let answer;
        if (reorderItem && reorderItem.days_of_stock_left !== null) {
          answer = window.VI.i18n.t('query.stockWithDays', {
            name: prod.name,
            qty: prod.current_qty,
            unit: prod.base_unit,
            days: reorderItem.days_of_stock_left
          });
        } else {
          answer = window.VI.i18n.t('query.stockResult', {
            name: prod.name,
            qty: prod.current_qty,
            unit: prod.base_unit
          });
        }

        showToast(answer);
        showQueryResultCard(answer);
        if (window.VI.tts) window.VI.tts.speak(answer);
      } catch (err) {
        console.error('Stock query failed:', err);
        showToast(err.message || 'Stock query failed', true);
      }
    }

    // Handle Query Low Stock: "what's low", "reorder list", "kya kam hai" (Phase 3.7)
    async function handleLowStockQuery() {
      try {
        // Pure DB fetch from /api/stock/reorder
        const lowItems = await window.VI.api('/stock/reorder');
        let answer;
        if (!lowItems || lowItems.length === 0) {
          answer = window.VI.i18n.t('query.noLowStock');
        } else {
          const listStr = lowItems.map(p => `${p.name} (${p.current_qty} ${p.base_unit})`).join(', ');
          answer = window.VI.i18n.t('query.lowStockSummary', {
            count: lowItems.length,
            items: listStr
          });
        }

        showToast(answer);
        showQueryResultCard(answer);
        if (window.VI.tts) window.VI.tts.speak(answer);
      } catch (err) {
        console.error('Low stock query failed:', err);
        showToast(err.message || 'Low stock query failed', true);
      }
    }

    // Parse command from voice or typed input
    async function submitCommand(rawText) {
      if (!rawText || !rawText.trim()) return;
      currentRawTranscript = rawText.trim();
      setMicState('processing');

      const langCode = (currentSpeechLang || 'hi').slice(0, 2);

      try {
        const data = await window.VI.api('/parse', {
          method: 'POST',
          body: {
            text: currentRawTranscript,
            lang: langCode
          }
        });

        if (!data || data.needsManualEntry || !data.items || (data.items.length === 0 && data.action !== 'query_low')) {
          setMicState('error');
          showToast(window.VI.i18n ? window.VI.i18n.t('toast.selectProductFirst') : 'Could not understand command, please type', true);
          document.getElementById('commandInput')?.focus();
          return;
        }

        // Query actions: query_stock or query_low (Phase 3.7)
        if (data.action === 'query_stock') {
          await handleStockQuery(data);
          setMicState('idle');
          return;
        }
        if (data.action === 'query_low') {
          await handleLowStockQuery();
          setMicState('idle');
          return;
        }

        // Stock movement confirmation flow (in / out / adjust)
        parsedQueue = data.items;
        currentQueueIndex = 0;
        currentParsedAction = data.action;
        isInlineEditing = false;

        renderConfirmationCard();
      } catch (err) {
        console.error('[submitCommand] Parse error:', err);
        setMicState('error');
        showToast(err.message || 'Command parse error', true);
        document.getElementById('commandInput')?.focus();
      }
    }

    // Render confirmation card using Milestone-1 component design in ONLY the active language
    function renderConfirmationCard() {
      const modal = document.getElementById('confirmModal');
      const container = document.getElementById('confirmCard');
      if (!modal || !container || parsedQueue.length === 0) return;

      // REQUIREMENT 2: Generate idempotency key ONCE per card presentation
      currentCardIdempotencyKey = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'key-' + Date.now() + '-' + Math.random().toString(36).slice(2);

      const item = parsedQueue[currentQueueIndex];
      const isMulti = parsedQueue.length > 1;

      // Action Styling with localized titles
      let actionTitle = window.VI.i18n ? window.VI.i18n.t('confirm.actionIn') : 'Stock In';
      let actionBadgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-400';
      let actionArrow = '↑';
      if (currentParsedAction === 'out') {
        actionTitle = window.VI.i18n ? window.VI.i18n.t('confirm.actionOut') : 'Stock Out';
        actionBadgeClass = 'bg-red-100 text-red-800 border-red-400';
        actionArrow = '↓';
      } else if (currentParsedAction === 'adjust') {
        actionTitle = window.VI.i18n ? window.VI.i18n.t('confirm.actionAdjust') : 'Stock Adjustment';
        actionBadgeClass = 'bg-blue-100 text-blue-800 border-blue-400';
        actionArrow = '⚙';
      }

      const hasMatched = Boolean(item.matched);
      const isAmbiguous = !hasMatched && Array.isArray(item.candidates) && item.candidates.length > 0;

      container.innerHTML = `
        <!-- Top Bar: Step indicator + Action chip + Dismiss -->
        <div class="flex items-center justify-between pb-2 border-b" style="border-color: var(--color-border-subtle);">
          <div class="flex items-center gap-1.5">
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-black border ${actionBadgeClass}">
              <span>${actionArrow}</span>
              <span>${actionTitle}</span>
            </span>
            ${isMulti ? `<span class="text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">${currentQueueIndex + 1}/${parsedQueue.length}</span>` : ''}
          </div>
          <button onclick="closeConfirmModal()" class="w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 bg-slate-100 cursor-pointer">
            ✕
          </button>
        </div>

        <!-- Normal View Mode -->
        <div id="confirmViewMode" class="${isInlineEditing ? 'hidden' : 'block'} py-3 space-y-3 text-center">
          
          ${hasMatched ? `
            <div>
              <h2 class="font-extrabold text-xl leading-snug text-[var(--color-text-primary)]">
                ${item.matched.name}
              </h2>
              <p class="text-xs font-semibold text-slate-500 mt-0.5">
                ${item.matched.category || 'General'} • ${window.VI.i18n ? window.VI.i18n.t('confirm.currentStock', { qty: item.matched.current_qty, unit: item.matched.base_unit }) : `Stock: ${item.matched.current_qty} ${item.matched.base_unit}`}
              </p>
            </div>

            <!-- Big Quantity + Unit Display (Milestone-1 typography) -->
            <div class="flex items-center justify-center gap-3 py-1">
              <span class="font-black text-5xl tracking-tight text-[var(--color-text-primary)]">${item.qty || 1}</span>
              <div class="flex flex-col items-start justify-center text-left">
                <span class="text-xs font-extrabold uppercase px-2 py-0.5 rounded bg-amber-100 text-amber-900 border border-amber-300">
                  ${item.unit || item.matched.base_unit}
                </span>
                <span class="text-[10px] text-slate-400 mt-0.5">${window.VI.i18n ? window.VI.i18n.t('confirm.qty') : 'Quantity'}</span>
              </div>
            </div>
          ` : `
            <!-- Ambiguous Match Candidate Selection (Requirement 4) -->
            <div class="space-y-2 text-left">
              <div class="p-2 rounded-xl bg-amber-50 border border-amber-200 text-xs font-bold text-amber-900 flex items-center gap-2">
                <span>⚠️</span>
                <span>${window.VI.i18n ? window.VI.i18n.t('confirm.whichOne') : 'Which product?'}</span>
              </div>
              <p class="text-xs text-slate-600 font-medium">
                Spoken: <span class="font-bold text-slate-900">"${item.product_hint}"</span>
              </p>

              <!-- Candidates List (Milestone-1 list styling) -->
              <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                ${isAmbiguous ? item.candidates.map(c => `
                  <div onclick="selectCandidate('${c.id}')" class="tappable-chip w-full p-2.5 rounded-xl border flex items-center justify-between cursor-pointer bg-slate-50 hover:bg-orange-50/60 hover:border-orange-400 transition" style="border-width: var(--border-width);">
                    <div>
                      <div class="font-extrabold text-xs text-slate-900">${c.name}</div>
                      <div class="text-[10px] text-slate-500">${c.category || 'General'} • ${c.current_qty} ${c.base_unit}</div>
                    </div>
                    <div class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center">
                      <div class="w-2.5 h-2.5 rounded-full bg-orange-600 hidden"></div>
                    </div>
                  </div>
                `).join('') : `
                  <!-- Fallback dropdown if no direct candidates -->
                  <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-600">${window.VI.i18n ? window.VI.i18n.t('confirm.product') : 'Product'}:</label>
                    <select onchange="handleDropdownProductSelect(this.value)" class="w-full h-10 px-2 rounded-xl border text-xs font-bold bg-white focus:ring-2 focus:ring-blue-600">
                      <option value="">-- Select --</option>
                      ${userProductsCache.map(p => `<option value="${p.id}">${p.name} (${p.current_qty} ${p.base_unit})</option>`).join('')}
                    </select>
                  </div>
                `}
              </div>

              <!-- Quantity display for ambiguous item -->
              <div class="flex items-center justify-center gap-2 pt-1 text-sm font-bold text-slate-700">
                <span>${window.VI.i18n ? window.VI.i18n.t('confirm.qty') : 'Quantity'}:</span>
                <span class="px-2 py-0.5 rounded bg-slate-100 font-black text-slate-900">${item.qty || 1} ${item.unit || ''}</span>
              </div>
            </div>
          `}

          <!-- Trust Signal: Original transcript -->
          <div class="w-full bg-slate-50 border rounded-xl py-1.5 px-2.5 flex items-center justify-center gap-1.5 text-xs text-slate-600" style="border-color: var(--color-border-subtle);">
            <span>🗣️</span>
            <span class="font-semibold italic text-slate-800 truncate">"${currentRawTranscript}"</span>
          </div>

        </div>

        <!-- Inline Edit Mode (Requirement 3: adjust in same card without new screen) -->
        <div id="confirmEditMode" class="${isInlineEditing ? 'block' : 'hidden'} py-2 space-y-2.5 text-left">
          <div class="text-xs font-extrabold text-blue-900 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-200">
            ✏️ ${window.VI.i18n ? window.VI.i18n.t('confirm.editBtn') : 'Edit'}
          </div>

          <div>
            <label class="text-[11px] font-bold text-slate-700">${window.VI.i18n ? window.VI.i18n.t('confirm.product') : 'Product'}:</label>
            <select id="editProdSelect" class="w-full h-10 px-2 mt-0.5 rounded-xl border text-xs font-bold bg-white focus:ring-2 focus:ring-blue-600" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
              ${userProductsCache.map(p => `
                <option value="${p.id}" ${item.matched && item.matched.id === p.id ? 'selected' : ''}>
                  ${p.name} (${p.category || 'General'})
                </option>
              `).join('')}
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-bold text-slate-700">${window.VI.i18n ? window.VI.i18n.t('confirm.qty') : 'Qty'}:</label>
              <input id="editQtyVal" type="number" step="any" min="0.001" value="${item.qty || 1}" class="w-full h-10 px-2 mt-0.5 rounded-xl border text-sm font-extrabold bg-white focus:ring-2 focus:ring-blue-600" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-700">${window.VI.i18n ? window.VI.i18n.t('confirm.unit') : 'Unit'}:</label>
              <select id="editUnitVal" class="w-full h-10 px-2 mt-0.5 rounded-xl border text-xs font-bold bg-white focus:ring-2 focus:ring-blue-600" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
                ${['bag', 'kg', 'g', 'l', 'ml', 'packet', 'box', 'bottle', 'can', 'tin', 'dozen', 'pcs', 'quintal'].map(u => `
                  <option value="${u}" ${(item.unit && item.unit.toLowerCase() === u) ? 'selected' : ''}>${u}</option>
                `).join('')}
              </select>
            </div>
          </div>

          <button onclick="saveInlineEdit()" class="w-full h-10 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center gap-1 cursor-pointer active:scale-97 shadow-xs">
            <span>✓ ${window.VI.i18n ? window.VI.i18n.t('confirm.saveBtn') : 'Save'}</span>
          </button>
        </div>

        <!-- Buttons Section (Reusing Milestone-1 button styles) -->
        <div class="pt-2 border-t space-y-2" style="border-color: var(--color-border-subtle);">
          
          <!-- Confirm Button (Single/Current item) -->
          <button id="confirmItemBtn" ${hasMatched ? '' : 'disabled'} onclick="handleConfirmCurrent()" class="w-full h-12 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2 text-white shadow-md transition-all active:scale-97 cursor-pointer ${hasMatched ? 'bg-[var(--color-primary-blue)] hover:bg-blue-700' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}">
            <span>✓</span>
            <span>${window.VI.i18n ? window.VI.i18n.t('confirm.confirmBtn') : 'Confirm'}</span>
          </button>

          <div class="flex items-center gap-2">
            <!-- Edit Button -->
            <button onclick="toggleInlineEdit()" class="flex-1 h-10 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border bg-white text-slate-700 hover:bg-slate-50 active:scale-97 cursor-pointer" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
              <span>${isInlineEditing ? (window.VI.i18n ? window.VI.i18n.t('confirm.cancelBtn') : 'Cancel') : ('✏️ ' + (window.VI.i18n ? window.VI.i18n.t('confirm.editBtn') : 'Edit'))}</span>
            </button>

            <!-- Cancel Flow Button -->
            <button onclick="closeConfirmModal()" class="flex-1 h-10 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border bg-white text-red-600 hover:bg-red-50 active:scale-97 cursor-pointer" style="border-width: var(--border-width); border-color: var(--color-border-subtle);">
              <span>✕ ${window.VI.i18n ? window.VI.i18n.t('confirm.cancelBtn') : 'Cancel'}</span>
            </button>
          </div>

          <!-- Multi-item Batch Button: Confirm All (Requirement 5) -->
          ${(isMulti && parsedQueue.every(i => i.matched)) ? `
            <button onclick="handleConfirmAll()" class="w-full h-10 rounded-xl font-extrabold text-xs bg-emerald-700 text-white flex items-center justify-center gap-1.5 shadow-sm active:scale-97 cursor-pointer hover:bg-emerald-800">
              <span>✓✓</span>
              <span>${window.VI.i18n ? window.VI.i18n.t('confirm.confirmAllBtn', { count: parsedQueue.length }) : `Confirm All (${parsedQueue.length})`}</span>
            </button>
          ` : ''}

        </div>
      `;

      modal.classList.remove('hidden');
    }

    function selectCandidate(productId) {
      const prod = userProductsCache.find(p => p.id === productId);
      if (!prod) return;
      parsedQueue[currentQueueIndex].matched = prod;
      renderConfirmationCard();
    }

    function handleDropdownProductSelect(productId) {
      selectCandidate(productId);
    }

    function toggleInlineEdit() {
      isInlineEditing = !isInlineEditing;
      renderConfirmationCard();
    }

    function saveInlineEdit() {
      const prodId = document.getElementById('editProdSelect')?.value;
      const qtyVal = Number(document.getElementById('editQtyVal')?.value) || 1;
      const unitVal = document.getElementById('editUnitVal')?.value || 'pcs';

      const prod = userProductsCache.find(p => p.id === prodId);
      if (prod) {
        parsedQueue[currentQueueIndex].matched = prod;
      }
      parsedQueue[currentQueueIndex].qty = qtyVal;
      parsedQueue[currentQueueIndex].unit = unitVal;
      isInlineEditing = false;
      renderConfirmationCard();
    }

    function closeConfirmModal() {
      const modal = document.getElementById('confirmModal');
      if (modal) modal.classList.add('hidden');
      parsedQueue = [];
      currentQueueIndex = 0;
      currentCardIdempotencyKey = null;
      isInlineEditing = false;
      setMicState('idle');
      document.getElementById('commandInput')?.focus();
    }

    // Apply stock movement using single generated idempotency key (Requirement 2)
    async function handleConfirmCurrent() {
      const item = parsedQueue[currentQueueIndex];
      if (!item || !item.matched) {
        showToast(window.VI.i18n ? window.VI.i18n.t('toast.selectProductFirst') : 'Please select product', true);
        return;
      }

      const btn = document.getElementById('confirmItemBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳</span><span>${window.VI.i18n ? window.VI.i18n.t('confirm.saving') : 'Saving...'}</span>`;
      }

      const keyToSend = currentCardIdempotencyKey;
      const productId = item.matched.id;
      const qty = Number(item.qty) || 1;
      const unit = item.unit || item.matched.base_unit;

      try {
        const res = await window.VI.api(`/products/${productId}/stock`, {
          method: 'POST',
          body: {
            type: currentParsedAction,
            qty,
            unit,
            idempotency_key: keyToSend
          }
        });

        // Store last successful action for Undo (Requirement 7)
        lastSuccessfulMovement = {
          productId,
          movementId: res.id,
          summary: `${qty} ${unit} ${item.matched.name}`
        };
        showUndoAffordance();

        // Spoken confirmation (Requirement 6) in ONLY active language
        const spokenPhrase = window.VI.i18n ? window.VI.i18n.t('toast.stockUpdated', { qty, unit, name: item.matched.name }) : `${qty} ${unit} ${item.matched.name} updated`;
        if (window.VI.tts) {
          window.VI.tts.speak(spokenPhrase, window.VI.i18n ? window.VI.i18n.getLang() : 'hi');
        }
        showToast(spokenPhrase);

        // Advance multi-item or finish
        if (currentQueueIndex < parsedQueue.length - 1) {
          currentQueueIndex++;
          renderConfirmationCard();
        } else {
          closeConfirmModal();
          await loadDashboardStats();
          const cmd = document.getElementById('commandInput');
          if (cmd) cmd.value = '';
        }
      } catch (err) {
        console.error('Failed to apply stock movement:', err);
        showToast(err.message || 'Failed to update stock', true);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>✓</span><span>${window.VI.i18n ? window.VI.i18n.t('confirm.tryAgain') : 'Try Again'}</span>`;
        }
      }
    }

    async function handleConfirmAll() {
      for (let i = 0; i < parsedQueue.length; i++) {
        currentQueueIndex = i;
        currentCardIdempotencyKey = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'all-' + Date.now() + '-' + i;
        await handleConfirmCurrent();
      }
    }

    function showUndoAffordance() {
      const banner = document.getElementById('undoBanner');
      const text = document.getElementById('undoSummaryText');
      if (banner && text && lastSuccessfulMovement) {
        text.textContent = lastSuccessfulMovement.summary;
        banner.classList.remove('hidden');
      }
    }

    // Undo action (Requirement 7)
    async function handleUndoLastAction() {
      if (!lastSuccessfulMovement) return;
      const { productId, movementId } = lastSuccessfulMovement;
      const undoBtn = document.getElementById('undoBtn');
      if (undoBtn) {
        undoBtn.disabled = true;
      }

      try {
        await window.VI.api(`/products/${productId}/undo/${movementId}`, {
          method: 'POST'
        });

        const undoMsg = window.VI.i18n ? window.VI.i18n.t('undo.undoneSuccess') : 'Action undone';
        showToast(undoMsg);
        if (window.VI.tts) {
          window.VI.tts.speak(undoMsg, window.VI.i18n ? window.VI.i18n.getLang() : 'hi');
        }
        lastSuccessfulMovement = null;
        document.getElementById('undoBanner')?.classList.add('hidden');
        await loadDashboardStats();
      } catch (err) {
        console.error('Undo failed:', err);
        showToast(err.message || 'Undo failed', true);
      } finally {
        if (undoBtn) {
          undoBtn.disabled = false;
        }
      }
    }

    // Connect speech events on DOM ready
    let speechListenersRegistered = false;
    function initDashboardSpeech() {
      if (speechListenersRegistered) return;
      if (window.VI && window.VI.i18n) {
        window.VI.i18n.updateButtons(window.VI.i18n.getLang());
        updateExamplePhrasesForLang(window.VI.i18n.getLang());
        window.VI.i18n.onLangChange((newLang, speechTag) => {
          currentSpeechLang = speechTag;
          updateExamplePhrasesForLang(newLang);
          loadDashboardStats();
        });
      }
      loadDashboardStats();

      // Hook typed input enter key
      const input = document.getElementById('commandInput');
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const val = input.value.trim();
            if (val) {
              submitCommand(val);
            }
          }
        });
      }

      const speech = window.VI && window.VI.speech;
      if (!speech) return;

      speechListenersRegistered = true;

      speech.onStart(() => {
        setMicState('listening');
      });

      speech.onPartial((transcript) => {
        if (input) {
          input.value = transcript;
        }
      });

      speech.onFinal((transcript) => {
        if (input) {
          input.value = transcript;
        }
        submitCommand(transcript);
      });

      speech.onError((code, details) => {
        setMicState('error');
        const msg = details?.message || speech.getErrorMessage(code);
        showToast(msg, true);
        document.getElementById('commandInput')?.focus();
      });

      speech.onEnd(() => {
        if (currentState === 'listening') {
          setMicState('idle');
        }
      });
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initDashboardSpeech);
    } else {
      initDashboardSpeech();
    }
  </script>
</body>
</html>
